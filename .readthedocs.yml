# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/sources/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    # The example notebooks are executed while building the documentation,
    # so the Rust extension is compiled (maturin) and installed first.
    rust: "latest"
  jobs:
    install:
      - pip install --upgrade pip
      - pip install --group docs
      - pip install .
