[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "quickpaver"
# The version is taken from Cargo.toml: bump it there only.
dynamic = ["version"]
authors = [{ name = "Antoine Collet", email = "antoinecollet5@gmail.com" }]
readme = "README.rst"
description = "A python package providing a paving toolbox, with Rust-accelerated conservative transfer matrices."
keywords = ["Paving", "Tiling", "Triangle", "Hexagon", "Grid", "Rectilinear", "Rust"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "shapely>=2.1", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pypi.org/project/quickpaver/"
Documentation = "https://quickpaver.readthedocs.io/en/latest/"
Repository = "https://github.com/antoinecollet5/quickpaver"
Issues = "https://github.com/antoinecollet5/quickpaver/issues"
Changelog = "https://github.com/antoinecollet5/quickpaver/blob/master/CHANGELOG.rst"

[project.optional-dependencies]
# drawing helpers (draw_adjacency, ...); the rest of the package needs no matplotlib
plot = ["matplotlib>=3.5"]
pyvista = ["pyvista"]
examples = ["matplotlib", "marimo", "nested_grid_plotter>=2.1.0", "pyvista[all]"]
all = ["quickpaver[plot,pyvista,examples]"]

# Development dependencies (PEP 735): `uv sync` installs the `dev` group by default,
# `pip install --group dev` works with pip >= 25.1.
[dependency-groups]
test = ["pytest>=8", "pytest-cov"]
lint = [
    "ruff==0.17.6",
    "ty==0.0.111",
    "codespell>=2.3",
    "pre-commit>=4",
    "pre-commit-hooks>=5",
    # optional dependency (drawing helpers, notebooks): needed by ty to resolve
    # the imports it type-checks
    "matplotlib>=3.5",
]
# The marimo notebooks are executed while building the documentation, so the
# compiled package must be installed too (see .readthedocs.yml).
docs = [
    "numpy>=1.22",
    "shapely>=2.1",
    "scipy>=1.10",
    "matplotlib",
    "nested_grid_plotter>=2.1.0",
    "sphinx<9",
    "sphinx-jsonschema>=1.15",
    "pygments>=2.11.1",
    "pydata-sphinx-theme",
    "sphinxcontrib-bibtex",
    "sphinx_math_dollar",
    # the example notebooks are executed and exported to HTML by marimo
    "marimo",
]
dev = [
    "maturin>=1.9,<2",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
# `uv sync` / `uv run` rebuild the extension whenever the Rust code changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[tool.maturin]
python-source = "python"
module-name = "quickpaver._quickpaver"
features = ["pyo3/extension-module"]
include = [{ path = "tests/**/*.py", format = "sdist" }]
exclude = [
    { path = "dist/**", format = "sdist" },
    { path = "_static/**", format = "sdist" },
    { path = "**/__pycache__/**", format = "sdist" },
    { path = ".github/**", format = "sdist" },
    { path = ".pre-commit-config.yaml", format = "sdist" },
]

[tool.ruff]
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
]
src = ["python", "tests", "docs", "notebooks"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["A", "B", "C", "D", "E", "F", "I"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pylint.LOGGING]
# Format style used to check logging format string. `old` means using %
# formatting, `new` is for `{}` formatting,and `fstr` is for f-strings.
logging-format-style = "fstr"

[tool.ty.src]
include = ["python", "tests", "notebooks", "benchmarks"]

[tool.ty.analysis]
# Optional dependencies of the examples, imported only there.
allowed-unresolved-imports = ["marimo", "nested_grid_plotter", "pyvista"]


[tool.pytest.ini_options]
testpaths = ["tests", "notebooks"]

[tool.bandit]
skips = ["B101"]

[[tool.ty.overrides]]
include = ["tests/**", "benchmarks/**"]

[tool.ty.overrides.rules]
import-not-found = "ignore"
possibly-missing-submodule = "ignore"
